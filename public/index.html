<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Stock Research Dashboard</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <div class="shell">
    <aside class="sidebar">
      <a class="brand" href="/" aria-label="Stock Research home"><span class="brand-mark" aria-hidden="true"><span></span><span></span><span></span></span> Stock Research</a>
      <nav class="navigation" aria-label="Workspace">
        <button type="button" class="nav-item selected" data-view="research" aria-current="page"><span aria-hidden="true">◫</span> Research</button>
        <button type="button" class="nav-item" data-view="watchlist"><span aria-hidden="true">☆</span> Watchlist</button>
        <button type="button" class="nav-item" data-view="portfolio"><span aria-hidden="true">◧</span> Portfolio</button>
        <button type="button" class="nav-item" data-view="history"><span aria-hidden="true">◷</span> Analysis history</button>
      </nav>
      <div class="sidebar-account" id="account-area" hidden>
        <div class="avatar" aria-hidden="true" id="account-initials">D</div>
        <div class="account-text"><strong id="account-name">Demo workspace</strong><button class="text-button" type="button" id="logout">Sign out</button></div>
      </div>
    </aside>
    <main class="content">
      <header class="page-top">
        <div><h1 id="view-title">Stock research</h1><p id="view-description">Run independent analyses and follow the evidence behind each score.</p></div>
        <span class="data-state" id="data-state" hidden></span>
      </header>
      <section class="market-overview" id="market-overview" aria-labelledby="market-overview-title" hidden>
        <div class="market-overview-header">
          <h2 id="market-overview-title">Market highlights</h2>
          <p id="market-overview-caption"></p>
        </div>
        <div class="market-tiles" id="market-tiles"></div>
      </section>
      <p class="notice" id="notice" role="status" hidden></p>
      <section id="account-panel" class="card sign-in" aria-labelledby="account-title" hidden>
        <h2 id="account-title">Open your workspace</h2>
        <p id="account-intro"></p>
        <form id="auth-form">
          <div id="auth-fields" hidden>
            <div id="username-field" hidden>
              <label for="username">Username</label><input id="username" autocomplete="username" minlength="3" maxlength="24" pattern="[a-zA-Z0-9_]{3,24}" title="3–24 letters, numbers, or underscores">
            </div>
            <label for="email">Email</label><input id="email" type="email" autocomplete="email" maxlength="254">
            <div id="password-field">
              <label for="password">Password</label><input id="password" type="password" autocomplete="current-password" minlength="8" maxlength="256">
            </div>
            <div id="code-field" hidden>
              <label for="email-code">Verification code</label><input id="email-code" autocomplete="one-time-code" inputmode="numeric" pattern="[0-9]{6,10}" maxlength="10">
            </div>
          </div>
          <button class="primary" type="submit" id="sign-in">Open demo</button>
          <button class="text-button" type="button" id="auth-switch" hidden>Create account</button>
          <button class="text-button" type="button" id="resend-confirmation" hidden>Resend email</button>
        </form>
      </section>
      <div id="workspace" hidden>
        <section id="research" class="view" aria-labelledby="view-title">
          <div class="research-grid">
            <article class="card stock-card">
              <div class="stock-search">
                <label class="search-label" for="stock-search"><span aria-hidden="true">⌕</span><input id="stock-search" type="search" placeholder="Search symbol or company" autocomplete="off"></label>
                <select id="universe" aria-label="Filter covered companies">
                  <option value="all">All covered stocks</option>
                  <option value="nasdaq">Nasdaq-100 sample</option>
                  <option value="sp500">S&amp;P 500 sample</option>
                </select>
                <div id="search-results" class="search-results" hidden></div>
              </div>
              <div class="stock-header">
                <div class="stock-identity"><span id="stock-logo" class="stock-logo" aria-hidden="true">N</span><div><h2 id="stock-name"></h2><p id="stock-symbol"></p></div></div>
                <button class="secondary save" id="watch-toggle" type="button" aria-pressed="false">☆ Save stock</button>
              </div>
              <div class="quote"><strong id="price">—</strong><span id="change"></span></div>
              <p class="market-date" id="market-date"></p>
              <div class="chart-wrap"><canvas id="chart" role="img" aria-label="Closing-price chart for the selected horizon"></canvas></div>
              <div class="chart-labels" id="chart-labels" aria-hidden="true"></div>
            </article>
            <article class="card setup">
              <h2>Run an analysis</h2>
              <form id="analysis-form">
                <fieldset><legend>Time horizon</legend><div class="segmented">
                  <label><input type="radio" name="horizon" value="1w"><span>1W</span></label>
                  <label><input type="radio" name="horizon" value="1m"><span>1M</span></label>
                  <label><input type="radio" name="horizon" value="3m"><span>3M</span></label>
                  <label><input type="radio" name="horizon" value="6m"><span>6M</span></label>
                </div></fieldset>
                <label class="field-label" for="provider">Model</label><select id="provider"></select>
                <fieldset><legend>Agents</legend><div class="segmented">
                  <label><input type="radio" name="agents" value="3"><span>3 agents</span></label>
                  <label><input type="radio" name="agents" value="5"><span>5 agents</span></label>
                </div></fieldset>
                <ul class="agent-preview" id="agent-preview"></ul>
                <button class="primary run" type="submit" id="run-button">Run analysis <span aria-hidden="true">↗</span></button>
                <button class="text-button save-pref" id="save-pref" type="button">Save these defaults</button>
              </form>
            </article>
          </div>
          <section class="results" id="result-panel" aria-labelledby="result-title" hidden>
            <header class="section-header"><div><h2 id="result-title">Agent analysis</h2><p id="result-meta"></p></div><strong id="result-score" class="score-display"></strong></header>
            <div id="agent-results" class="agent-results"></div>
            <details class="trace card"><summary>MCP tool activity</summary><ul id="trace-list"></ul></details>
          </section>
        </section>
        <section id="watchlist" class="view card table-card" aria-labelledby="view-title" hidden><div id="watch-items"></div></section>
        <section id="portfolio" class="view card table-card" aria-labelledby="view-title" hidden>
          <form id="holding-form" class="holding-form">
            <label>Stock<select id="holding-stock" required></select></label>
            <label>Shares<input id="holding-shares" type="number" min=".000001" max="10000000" step=".000001" required></label>
            <label>Average cost (USD)<input id="holding-cost" type="number" min=".000001" max="10000000" step=".000001" required></label>
            <button class="primary" type="submit">Save holding</button>
          </form>
          <div id="holding-items"></div>
        </section>
        <section id="history" class="view card table-card" aria-labelledby="view-title" hidden><div id="history-items"></div></section>
      </div>
    </main>
  </div>
</body>
</html>
